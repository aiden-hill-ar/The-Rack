<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @view-transition { navigation: auto; }
        ::view-transition-old(root) {
            animation: page-out 300ms forwards 1;
        }
        ::view-transition-new(root) {
            animation: page-in 300ms forwards 1;
        }
        @keyframes page-out { to { opacity: 0; } }
        @keyframes page-in { from { opacity: 0; } }
        #mini-calculator .calculator { view-transition-name: calculator; }
        .full.calculator { view-transition-name: calculator; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json" />
    <link rel="shortcut icon" href="../svg/calculator.svg" />
    <link rel="stylesheet" href="../css/calculator.css" />
    <title>Calculator</title>
</head>
<body>
    <div class="infinity-title-container">
        <h1 class="infinity-title">Calculator, <span>Calculator,</span> Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, Calculator, </h1>
    </div>
    <div class="squiggly-line"></div>
    <section class="main">
        <div id="calculator" class="full calculator">
            <div class="frame top">
                <section class="screen">
                    <p class="starting">O.S. Yappy Krappy</p>
                    <a href="../index.html"><button class="quit-button">
                        <span class="shadow"></span>
                        <span class="edge"></span>
                        <span class="front"><p class="quit">Quit</p></span>
                    </button></a>
                    <p class="input">Awaiting Input<span>:</span></p>
                </section>
            </div>
            <div class="frame hinge"></div>
            <div class="frame bottom">
                <section class="buttons">
                    <button class="num-button num0" data-num="0"><span class="shadow"></span><span class="edge"></span><span class="front"><p>0</p></span></button>

                    <button class="num-button num1" data-num="1"><span class="shadow"></span><span class="edge"></span><span class="front"><p>1</p></span></button>

                    <button class="num-button num2" data-num="2"><span class="shadow"></span><span class="edge"></span><span class="front"><p>2</p></span></button>

                    <button class="num-button num3" data-num="3"><span class="shadow"></span><span class="edge"></span><span class="front"><p>3</p></span></button>

                    <button class="num-button num4" data-num="4"><span class="shadow"></span><span class="edge"></span><span class="front"><p>4</p></span>

                    <button class="num-button num5" data-num="5"><span class="shadow"></span><span class="edge"></span><span class="front"><p>5</p></span></button>

                    <button class="num-button num6" data-num="6"><span class="shadow"></span><span class="edge"></span><span class="front"><p>6</p></span></button>

                    <button class="num-button num7" data-num="7"><span class="shadow"></span><span class="edge"></span><span class="front"><p>7</p></span></button>

                    <button class="num-button num8" data-num="8"><span class="shadow"></span><span class="edge"></span><span class="front"><p>8</p></span></button>

                    <button class="num-button num9" data-num="9"><span class="shadow"></span><span class="edge"></span><span class="front"><p>9</p></span></button>

                    <button class="num-button dot" data-num="."><span class="shadow"></span><span class="edge"></span><span class="front"><p>.</p></span></button>


                    <button class="operator-button equals" data-num="="><span class="shadow"></span><span class="edge"></span><span class="front"><p>=</p></span></button>

                    <button class="operator-button plus" data-num="+"><span class="shadow"></span><span class="edge"></span><span class="front"><p>+</p></span></button>

                    <button class="operator-button minus" data-num="-"><span class="shadow"></span><span class="edge"></span><span class="front"><p>-</p></span></button>

                    <button class="operator-button multiply" data-num="*"><span class="shadow"></span><span class="edge"></span><span class="front"><p>X</p></span></button>

                    <button class="operator-button divide" data-num="/"><span class="shadow"></span><span class="edge"></span><span class="front"><p>/</p></span></button>


                    <button class="special-button delete" data-num="delete">
                        <span class="shadow"></span><span class="edge"></span>
                        <span class="front">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                                <g transform="translate(2.5,4)">
                                    <path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
                                    <path d="m12 9 6 6"/>
                                    <path d="m18 9-6 6"/>
                                </g>
                            </svg>
                        </span>
                    </button>

                    <button class="special-button clear" data-num="clear"><span class="shadow"></span><span class="edge"></span><span class="front"><p>AC</p></span></button>

                    <button class="special-button parenthesis" data-num="parenthesis"><span class="shadow"></span><span class="edge"></span><span class="front"><p>( )</p></span></button>

                    <button class="special-button positive-negative" data-num="positive-negative"><span class="shadow"></span><span class="edge"></span><span class="front"><p>+/-</p></span></button>
                </section>
            </div>
        </div>
    </section>
    <script src="../js/calculator.js"></script>
    <script src="../js/haptic.js"></script>
    <script src="../sw-register.js"></script>
</body>
</html>
