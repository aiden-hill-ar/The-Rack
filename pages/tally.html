<!DOCTYPE html>
<html lang="en">
<head>
   <style>
      @view-transition { navigation: auto; }
      ::view-transition-old(root) {
        animation: page-out 300ms forwards 1;
      }
      ::view-transition-new(root) {
         animation: page-in 300ms forwards 1;
      }
      @keyframes page-out { to { opacity: 0; } }
      @keyframes page-in { from { opacity: 0; } }
   </style>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="manifest" href="../manifest.json" />
   <link rel="stylesheet" href="../css/tally.css" />
   <title>Tally</title>
</head>
<body>
   <div class="top-bar">
      <a href="../index.html"><div class="quit-button">
         <div class="quit"></div>
      </div></a>
      <h1 class="title"><span>T</span><span>A</span><span>L</span><span>L</span><span>Y</span></h1>
   </div>
   <div class="top-buttons">
      <div class="button-group left-side">
         <button class="clear">
            <span class="shadow"></span>
            <span class="edge"></span>
            <span class="front">
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M13.5 10.5 22 2"/>
                  <path d="M14.734 13.841a2 2 0 00-.314-2.42L12.58 9.58a2 2 0 00-2.421-.314l-7.657 4.461A1 1 0 002.3 15.3l6.403 6.403a1 1 0 001.571-.204z"/>
                  <path d="m5 18 2-2"/>
                  <path d="m7.699 10.7 5.602 5.601"/>
               </svg>
            </span>
         </button>
      </div>
      <div class="button-group right-side">
         <button class="add-button">
            <span class="shadow"></span>
            <span class="edge"></span>
            <span class="front">
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 16 16">
                  <path d="M5 12h14"/>
                  <path d="M12 5v14"/>
               </svg>
            </span>
         </button>
         <button class="style-menu">
            <span class="shadow"></span>
            <span class="edge"></span>
            <span class="front">
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 20 20">
                  <rect width="18" height="18" x="3" y="3" rx="2"/>
                  <path d="M3 9h18"/>
               </svg>
            </span>
         </button>
         <ul class="style-dropdown">
            <li class="set-modern">Modern Style</li>
            <li class="set-classic">Classic Style</li>
            <li class="set-color">Tally Color</li>
         </ul>
      </div>
   </div>
   <div class="tallies">
      
   </div>
   <script src="../js/tally.js"></script>
   <script src="../sw-register.js"></script>
</body>
</html>
